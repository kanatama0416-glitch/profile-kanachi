button{cursor:pointer;pointer-events:auto;border:2px solid var(--line);font-family:inherit;background:#ffd768;font-weight:900;color:var(--ink);box-shadow:3px 3px 0 #14394c55}
#next{padding:9px 11px;min-height:36px}.chips{position:absolute;left:10px;right:10px;top:max(calc(env(safe-area-inset-top) + 128px),140px);display:flex;gap:5px;pointer-events:auto;flex-wrap:wrap}
.chips button{background:#fffaf0;font-size:10px;padding:7px 8px}.chips button.active{background:#f6d76b}
#start{display:none}
