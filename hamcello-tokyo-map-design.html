<style>
:root{--ink:#193e52;--sky:#1eaff4;--cream:#fff6e4;--coral:#ed6d53;--line:#12465a;font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#23b9fa;color:var(--ink);overflow-x:hidden}
#world{position:fixed;inset:0;width:100%;height:100dvh;image-rendering:pixelated;touch-action:pan-y;display:block}

.flag{position:absolute;top:max(calc(env(safe-area-inset-top) + 77px),91px);left:12px;font-weight:900;font-size:10px;background:#f4d46e;border:2px solid #284f60;padding:5px 8px}
.footer{position:absolute;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.progress{display:flex;flex:1;min-width:110px;max-width:220px;flex-direction:column;gap:4px;background:var(--cream);border:2px solid var(--line);padding:6px 8px;box-shadow:3px 3px 0 #14394c55}
.progress small{font-size:9px;font-weight:900;letter-spacing:.12em}.bar{height:7px;background:#c0e7ea}.bar b{height:100%;display:block;background:var(--coral);width:0}
#caption{background:var(--cream);border:2px solid var(--line);font-size:10px;font-weight:900;padding:9px 7px;flex:1;text-align:center;white-space:nowrap}
button{cursor:pointer;pointer-events:auto;border:2px solid var(--line);font-family:inherit;background:#ffd768;font-weight:900;color:var(--ink);box-shadow:3px 3px 0 #14394c55}
#next,#back{padding:9px 11px;min-height:36px}#back{background:#fff9e9}.chips{position:absolute;left:10px;right:10px;top:max(calc(env(safe-area-inset-top) + 128px),140px);display:flex;gap:5px;pointer-events:auto;flex-wrap:wrap}
.chips button{background:#fffaf0;font-size:10px;padding:7px 8px}.chips button.active{background:#f6d76b}
#start{display:none}
@media(max-width:600px){.hud{padding:7px 10px}.hud strong{font-size:15px}.flag{top:max(calc(env(safe-area-inset-top) + 66px),76px)}.chips{top:max(calc(env(safe-area-inset-top) + 104px),120px)}.chips button{padding:6px 7px;font-size:9px}.progress{max-width:37vw}.footer{gap:5px}.progress small{font-size:8px}}

<script>
(()=>{'use strict';
const canvas=document.getElementById('world');
const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const track=document.getElementById('scroll-track');
const name=document.getElementById('stage'), bar=document.getElementById('fill'), caption=document.getElementById('caption'), next=document.getElementById('next'), back=document.getElementById('back');
const buttons=[...document.querySelectorAll('[data-stage]')];
const images={}, labels=['01 / 浅草','02 / スカイツリー・東京駅','03 / 東京タワー','04 / 渋谷'];
const anchor=[0,380,800,1195];
const IMG_WIDTH=1536, IMG_HEIGHT=512;
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let vw=0,vh=0,dpr=1,scale=1,pan=0,progress=0,targetProgress=0,worldX=0;
let animId=0,lastTime=0,lastDraw=0,active=-1,needsFrame=true,readyImages=0;
let walking=false, moveDistance=0, lastWorld=0;
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const snap=v=>Math.round(v*dpr)/dpr;

for(const [key,uri] of Object.entries(MEDIA)){
 const img=new Image(); img.decoding='async';img.onload=()=>{readyImages++;request(true)};
 img.onerror=()=>{console.warn('Could not load asset:',key);request(true)};
 img.src=uri;images[key]=img;
}
function sprite(key,x,y,w,h,photo=false){
 const img=images[key];if(!img || !img.complete || !img.naturalWidth)return;
 ctx.save();
 ctx.imageSmoothingEnabled=photo;
 if(photo)ctx.imageSmoothingQuality='high';
 // Pixel art must land on the physical pixel grid. No fractional-position shimmer.
 ctx.drawImage(img,snap(x),snap(y),snap(w),snap(h));
 ctx.restore();
}
function resize(){
 const oldTarget=targetProgress;
 vw=innerWidth;vh=innerHeight;
 dpr=Math.min(devicePixelRatio||1,vw<750?2:1.5);
 canvas.width=Math.round(vw*dpr);canvas.height=Math.round(vh*dpr);
 canvas.style.width=vw+'px';canvas.style.height=vh+'px';
 const ideal=(vh*.77)/460;
 // Integer physical-pixel scale avoids softened / uneven pixel-art outlines.
 const physicalScale=Math.max(1,Math.round(ideal*dpr));
 scale=physicalScale/dpr;
 track.style.height=Math.max(vh+1800,Math.round(5300*scale))+'px';
 targetProgress=clamp(scrollY/Math.max(1,track.offsetHeight-vh),0,1);
 progress=targetProgress;
 pan=progress*Math.max(0,IMG_WIDTH*scale-vw);
 request(true);
}
function request(force=false){if(force)needsFrame=true;if(!animId && document.visibilityState!=='hidden')animId=requestAnimationFrame(frame)}
function positionForProgress(p){return 90+p*1330}
function groundTop(){return vh*.74-450*scale+453*scale}
function jumpHeight(wx){
 let best=0;
 for(const [center,height] of [[355,58],[580,75],[817,85],[916,72],[1165,82]]){
  const start=center-100,end=center+105;
  if(wx<=start||wx>=end)continue;
  const t=(wx-start)/(end-start);
  best=Math.max(best,Math.sin(Math.PI*t)*height);
 }
 return best;
}
function draw(t){
 const top=vh*.74-450*scale;
 const imageX=snap(-pan);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.imageSmoothingEnabled=false;
 ctx.fillStyle='#21b5f4';ctx.fillRect(0,0,vw,vh);
 sprite('tokyo_reference_clean',imageX,snap(top),IMG_WIDTH*scale,IMG_HEIGHT*scale);
 // Fill any portrait-space below the supplied 512px game art, without stretching buildings.
 const soilTop=snap(top+IMG_HEIGHT*scale);
 if(soilTop<vh){
  ctx.fillStyle='#a56d45';ctx.fillRect(0,soilTop,vw,vh-soilTop);
  const tile=images.soil_tile;
  if(tile?.complete && tile.naturalWidth){
   const tw=snap(108*scale),th=snap(35*scale);
   const startX=-((Math.round(pan)%Math.round(tw))||0);
   for(let yy=soilTop;yy<vh;yy+=th){
    for(let xx=startX;xx<vw;xx+=tw){
     ctx.drawImage(tile,snap(xx),snap(yy),tw,th);
    }
   }
  }
 }
 // Train keeps moving forward; no sinusoidal backwards travel.
 const trainWorld=295+((t*.060)%635);
 sprite('train',trainWorld*scale-pan,top+291*scale,348*scale,52*scale);
 const signalX=1420*scale-pan, signalY=top+327*scale;
 sprite('traffic_signal',signalX,signalY,63*scale,126*scale);
 if(signalX>-60 && signalX<vw+60){
  const lightOn=Math.floor(t/1500)%2===0;
  ctx.fillStyle=lightOn?'#62f06d':'#f5ac57';
  ctx.fillRect(snap(signalX+25*scale),snap(signalY+(lightOn?34:13)*scale),snap(9*scale),snap(10*scale));
 }
 const hamWorld=positionForProgress(progress);
 const x=hamWorld*scale-pan;
 const lift=jumpHeight(hamWorld)*scale;
 const jumping=lift>5;
 const pose=jumping?'ham_jump':walking?(Math.floor(moveDistance/26)%2?'ham_walk':'ham_run'):'ham_idle';
 // Keep real-photo-based Hamcello facing right, including while jumping.
 const width=(jumping?92:walking?85:69)*scale*.78;
 const height=(jumping?65:walking?67:80)*scale*.78;
 const sy=groundTop()-height-lift;
 ctx.save();
 ctx.translate(snap(x),0);ctx.scale(-1,1);
 sprite(pose,-width/2,sy,width,height,true);
 ctx.restore();
 const idx=hamWorld<350?0:hamWorld<790?1:hamWorld<1190?2:3;
 if(idx!==active){active=idx;name.textContent=labels[idx];buttons.forEach((b,i)=>b.classList.toggle('active',i===idx));}
 bar.style.width=(progress*100).toFixed(1)+'%';
 const messages=['横浜から東京に到着。浅草から出発','高架を列車が走る','東京タワーの石段','信号を越えて渋谷へ'];
 if(caption.textContent!==messages[idx])caption.textContent=messages[idx];
}
function frame(t){
 animId=0;
 const dt=Math.min(50,lastTime?Math.max(1,t-lastTime):16.7);lastTime=t;
 if(!needsFrame && t-lastDraw<33){request();return;}
 needsFrame=false;
 const delta=targetProgress-progress;
 progress=reduce?targetProgress:progress+delta*(1-Math.exp(-dt/85));
 if(Math.abs(progress-targetProgress)<.00005)progress=targetProgress;
 pan=progress*Math.max(0,IMG_WIDTH*scale-vw);
 const wx=positionForProgress(progress);
 const moved=Math.abs(wx-lastWorld);
 walking=moved>.22;
 if(walking)moveDistance+=moved;
 lastWorld=wx;
 worldX=(pan+vw*.32)/scale;
 draw(t);
 lastDraw=t;
 const trainScreenX=(295+((t*.060)%635))*scale-pan;
 const signalScreenX=1420*scale-pan;
 const trainVisible=trainScreenX>-360*scale&&trainScreenX<vw+60;
 const signalVisible=signalScreenX>-75*scale&&signalScreenX<vw+70;
 // No permanent redraw when both movable sprites are offscreen and scrolling stops.
 if(document.visibilityState==='visible' && (Math.abs(progress-targetProgress)>.00005 || trainVisible || signalVisible))request();
}
function onScroll(){targetProgress=clamp(scrollY/Math.max(1,track.offsetHeight-vh),0,1);request(true)}
function go(i){
 const maxScroll=Math.max(1,track.offsetHeight-vh);
 const maxPan=Math.max(1,IMG_WIDTH*scale-vw);
 const p=clamp((anchor[i]*scale-vw*.12)/maxPan,0,1);
 window.scrollTo({top:p*maxScroll,behavior:reduce?'instant':'smooth'});
}
buttons.forEach((b,i)=>b.addEventListener('click',()=>go(i)));
back.addEventListener('click',()=>{window.location.href='hamcello-yokohama-play.html?stage=end'});
next.addEventListener('click',()=>go((active+1)%4));
addEventListener('scroll',onScroll,{passive:true});
addEventListener('resize',resize,{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){lastTime=0;request(true)}});
addEventListener('pageshow',()=>{targetProgress=clamp(scrollY/Math.max(1,track.offsetHeight-vh),0,1);progress=targetProgress;request(true)});
resize();request(true);
})();
</script></body></html>
