const worldLabel=document.querySelector('#world-label');
const sceneLabel=document.querySelector('#scene-label');
const progressFill=document.querySelector('#progress-fill');
const status=document.querySelector('#status');
const next=document.querySelector('#next');
const reset=document.querySelector('#reset');
const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
const I={}; let loadCount=0;
const assets=window.HAMCELLO_ASSETS;
for(const [key,uri] of Object.entries(assets)){
 const im=new Image(); im.decoding='async';im.onload=()=>{loadCount++; requestFrame()};
 im.onerror=()=>{console.warn('Image unavailable: '+key);requestFrame()};
 im.src=uri;I[key]=im;
}
const STAGES=[
 {label:'01 / 港のコンテナ',from:0,to:1460},
 {label:'02 / 観覧車',from:1460,to:2700},
 {label:'03 / 赤レンガ倉庫',from:2700,to:3830},
 {label:'04 / 中華街',from:3830,to:5000}
];
const TOTAL=5000;
let W=0,H=0,dpr=1,scale=1,ground=0,view=0,maxScroll=1;
let raw=0,current=0,camera=0,cameraY=0,requested=false,lastDraw=0,elapsed=0,mobile=false;
let lastStage=-1,ready=false;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const smooth=t=>{t=clamp(t);return t*t*(3-2*t)};
const mix=(a,b,t)=>a+(b-a)*t;
function resize(){
 W=window.innerWidth;H=window.innerHeight;mobile=W<730;
 dpr=Math.min(window.devicePixelRatio||1,1.5);
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
 canvas.style.width=W+'px';canvas.style.height=H+'px';
 // One consistent world scale; the small protagonist fits a portrait screen.
 scale=Math.min(W/(mobile?630:1130),H/650);
 scale=Math.max(.48,Math.min(1.55,scale));
 ground=H*(mobile?.76:.805);
 view=W/scale;
 maxScroll=Math.max(1000,Math.round(5000*(mobile?1.18:1.08)));
 track.style.height=(maxScroll+H)+'px';
 raw=clamp(window.scrollY/maxScroll)*TOTAL;
 current=raw;
 requestFrame();
}
function requestFrame(){if(!requested){requested=true;requestAnimationFrame(frame)}}
const vis=im=>im&&im.complete&&im.naturalWidth>0;
function asset(key,x,y,w,h,flip=false){
 const im=I[key];if(!vis(im))return;
 ctx.save();ctx.imageSmoothingEnabled=false;
 if(flip){ctx.translate(x+w,y);ctx.scale(-1,1);ctx.drawImage(im,0,0,w,h)}
 else ctx.drawImage(im,x,y,w,h);
 ctx.restore();
}
function atX(wx){return (wx-camera)*scale}
function rect(x,y,w,h,clr){ctx.fillStyle=clr;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function pix(x,y,w,h,c){rect(atX(x),ground-y*scale,w*scale,h*scale,c)}
function text(s,x,y,size,color='#fff9dc',align='left'){
 ctx.save();ctx.font=`900 ${Math.round(size*scale)}px sans-serif`;ctx.textAlign=align;ctx.fillStyle=color;ctx.shadowColor='#153b4a';ctx.shadowBlur=0;ctx.shadowOffsetX=2*scale;ctx.shadowOffsetY=3*scale;
 ctx.fillText(s,atX(x),ground-y*scale);ctx.restore();
}
function worldSprite(key,x,fromGround,width,height,flip=false){
 const px=atX(x),py=ground-fromGround*scale;
 const w=width*scale,h=height*scale;
 if(px+w<-120||px>W+120)return;
 asset(key,px,py,w,h,flip);
}
function sky(){
 rect(0,0,W,H,'#01bafe');
 // The reference artwork has a generous cyan sky and square, white clouds.
 // The sky is one continuous color through all four scenes.
 const off=camera*.22;
 for(let j=-1;j<11;j++){
   const cx=(j*510+190-off)*scale;
   if(cx<-180||cx>W+180)continue;
   const cy=H*(.12+(j%3)*.075);
   rect(cx,cy,52*scale,13*scale,'#f9ffff');
   rect(cx+10*scale,cy-13*scale,31*scale,13*scale,'#f9ffff');
   rect(cx+19*scale,cy-21*scale,15*scale,9*scale,'#f9ffff');
 }
}
function sea(){
 const y=ground-63*scale;rect(0,y,W,55*scale,'#027bd0');
 for(let x=Math.floor(camera/110)*110;x<camera+view+140;x+=110){
  const xx=atX(x); rect(xx,y+23*scale,26*scale,5*scale,'#f7fcff');
  rect(xx+7*scale,y+20*scale,9*scale,4*scale,'#f7fcff');
 }
 rect(0,ground-8*scale,W,8*scale,'#0cbbd4');
}
function backgrounds(){
 // Short, overlapping scenic bands: no long gaps of empty sea between scenes.
 // Every panel keeps its original 16:9 ratio.
 const panels=[['bg_port',-300],['bg_ferris',535],['bg_ferris',1370],
               ['bg_brick',2205],['bg_china',3040]];
 const h=480*scale;
 for(const [key,x] of panels){
  const im=I[key], ratio=vis(im)?im.naturalWidth/im.naturalHeight:16/9;
  const xx=atX(x),ww=h*ratio;
  if(xx>W+4 || xx+ww<-4)continue;
  ctx.save();ctx.beginPath();ctx.rect(Math.max(0,xx),0,Math.min(W,Math.max(0,xx+ww)-Math.max(0,xx)),H);ctx.clip();
  asset(key,xx,ground-h,ww,h);ctx.restore();
 }
 // A varied pixel skyline continues behind the closer Chinatown buildings.
 for(let x=3760;x<5560;x+=58){
  const h=95+(((x*7+13)%97));
  const colors=['#96d7f0','#a8e1f3','#85cae8','#b9e6ee'];
  const c=colors[Math.floor(x/58)%colors.length];
  pix(x,h+72,54,h,c);
  for(let yy=0;yy<h-17;yy+=21){
   for(let xx=0;xx<39;xx+=15){
    pix(x+7+xx,h+55-yy,8,10,'#e7f8fd');
   }
  }
 }
}
function groundLayer(){
 const y=ground-3*scale;
 rect(0,y,W,H-y,'#c47543');
 // Use the exact grass-and-brown-soil palette of the supplied Yokohama artwork.
 const t=I.ground;
 if(vis(t)){
  const tw=256*scale,th=73*scale;
  let start=Math.floor(camera/256)*256;
  for(let x=start;x<camera+view+256;x+=256){
   const xx=atX(x);asset('ground',xx,y,tw,th);
   for(let row=1;row<16;row++){
     const py=y+73*scale+(row-1)*47*scale;
     if(py>H)break;
     ctx.drawImage(t,0,26,256,47,xx,py,tw,47*scale);
   }
  }
 }else{rect(0,y,W,9*scale,'#65e337')}
 rect(0,ground-12*scale,W,10*scale,'#66ed3d');
 rect(0,ground-3*scale,W,7*scale,'#19ab3a');
}
function pixelSign(wx,base,textTop,textBottom,accent='#fff3cf'){
 const x=atX(wx),y=ground-base*scale,w=130*scale,h=56*scale;
 if(x<-w||x>W+w)return;
 rect(x-5*scale,y-5*scale,w+10*scale,h+10*scale,'#264c59');
 rect(x,y,w,h,accent);
 ctx.save();ctx.textAlign='center';ctx.fillStyle='#254b4e';ctx.font=`bold ${Math.round(11*scale)}px sans-serif`;
 ctx.fillText(textTop,x+w/2,y+19*scale);ctx.font=`900 ${Math.round(17*scale)}px sans-serif`;
 ctx.fillText(textBottom,x+w/2,y+43*scale);ctx.restore();
}
// Street scenery is made from separate foreground objects, not stretched backgrounds.
// The denser streets fill the former empty walk between red brick and Chinatown.
function house(wx,w,h,kind){
 const pal=[
  {wall:'#b9574a',shade:'#903f40',roof:'#2c5364',tile:'#497f86',glass:'#e8f9ee',light:'#f3c76f'},
  {wall:'#e2b572',shade:'#bf7650',roof:'#217a79',tile:'#399996',glass:'#d8f4ff',light:'#fff0ba'},
  {wall:'#b83e42',shade:'#842c42',roof:'#e1a52a',tile:'#ffd160',glass:'#c8f3ef',light:'#f9d19c'},
  {wall:'#b67b61',shade:'#835b60',roof:'#375579',tile:'#58819e',glass:'#f2e7c6',light:'#ffcf89'}
 ][kind%4];
 pix(wx,h,w,h,pal.wall);pix(wx+8,h-10,w-16,h-16,pal.shade);
 // Traditional cornice, step roof, dark-blue or jade roof tiles.
 pix(wx-10,h+12,w+20,20,pal.roof);
 pix(wx+5,h+25,w-10,12,pal.tile);
 for(let xx=wx+10;xx<wx+w-18;xx+=25)pix(xx,h+30,12,7,pal.roof);
 for(let y=60;y<h-30;y+=61){
  for(let x=wx+23;x<wx+w-36;x+=59){
   pix(x,y+32,32,43,pal.roof);pix(x+5,y+25,22,31,pal.glass);
   pix(x+14,y+25,4,31,pal.shade);pix(x-3,y-10,38,6,pal.light);
  }
 }
 // An awning and open storefront below each house.
 pix(wx+12,72,w-24,15,pal.roof);
 for(let i=0;i<Math.floor((w-24)/24);i++)pix(wx+12+i*24,63,24,9,i%2?'#fff1d2':'#cf6651');
 pix(wx+32,50,52,44,'#283d59');pix(wx+39,42,38,29,pal.glass);
 pix(wx+w-73,49,42,40,'#283d59');pix(wx+w-65,43,26,27,pal.light);
}
function shrub(wx){
 pix(wx+14,33,14,40,'#745c42');
 for(const [dx,dy,c] of [[0,55,'#377d51'],[12,71,'#5cad56'],[30,50,'#298d59'],[19,82,'#87c956'],[-9,45,'#398652']])pix(wx+dx,dy,37,28,c);
 for(const dx of [7,32])pix(wx+dx,64,7,7,'#b3ea7e');
}
function streetLamp(wx){
 pix(wx+17,139,8,139,'#203c54');pix(wx+8,153,27,13,'#203c54');
 pix(wx+12,150,19,25,'#ffd86c');pix(wx+16,154,11,14,'#fff3b9');
 pix(wx+5,161,34,6,'#203c54');pix(wx+12,168,20,6,'#203c54');
 pix(wx+12,17,20,10,'#203c54');
}
function waterfrontDetails(){
 // Brick warehouse ends at 3680, and Chinatown begins immediately after.
 for(const x of [2830,3690])streetLamp(x);
 shrub(3745);shrub(3900);
 // Low stone planters and flower boxes give texture to the harbor promenade.
 for(const x of [2745,2830,3750,3890]){
  pix(x,24,58,17,'#d9d7b5');pix(x+3,26,52,11,'#9caaa0');
  for(let j=0;j<3;j++){
   pix(x+8+j*17,42,14,15,j===1?'#62ad4e':'#2f8b50');
   pix(x+12+j*17,47,5,5,'#ffd676');
  }
 }
}
function chinaStreet(){
 // Actual streets follow the red brick facade, rather than a long patch of sky.
 house(3768,210,255,0);
 house(4438,264,285,2);
 house(4720,262,268,1);
 house(5000,338,262,3);
 // Shaded top-floor verandas and street details on the shops.
 for(const x of [4505,4630,4785,4890,5090,5220]){
  pix(x,174,32,8,'#ffd177');pix(x+4,169,24,23,'#234c62');
  pix(x+9,163,14,11,'#ffe7a0');
 }
 for(const x of [3895,4460,4730,5030])shrub(x);
 for(const x of [4420,4990,5300])streetLamp(x);
 // Railings and benches on the station approach, with clear passage for Hamcello.
 for(const x of [4950,5012,5074,5136]){
  pix(x,30,9,28,'#e5ddd0');pix(x+8,31,54,6,'#345a66');
 }
 // Direction board, station steps and a tram waiting beyond the food stalls.
 pix(5285,42,115,14,'#c7b69a');pix(5285,47,115,5,'#d9d6bc');
}
function portObstacles(){
 // Platform objects have fixed world positions and are used for the jump path.
 worldSprite('crate',365,70,74,70);worldSprite('container_blue',580,84,196,84);
 worldSprite('crate',780,70,74,70);worldSprite('container_red',950,77,192,77);
 worldSprite('container_yellow',1040,160,175,77);
 worldSprite('crane',1050,345,310,300);
 // Hanging hook changes only with movement, not time.
 const hook=clamp((current-750)/350);
 const x=atX(1150),yy=ground-(265-65*hook)*scale;
 rect(x,ground-310*scale,4*scale,(48+65*hook)*scale,'#31566d');
 worldSprite('crate',1310,70,74,70);
 pixelSign(100,180,'WORLD 1-1','横浜港');
}
function ferrisProps(){
 const wc=2090,cy=ground-230*scale,rad=165*scale;
 worldSprite('ferris_support',1950,312,280,310);
 if(atX(wc)>-370&&atX(wc)<W+370){
  const rot=smooth(clamp((current-1800)/760))*Math.PI*2;
  ctx.save();ctx.translate(atX(wc),cy);ctx.rotate(rot);
  asset('ferris_rotor',-170*scale,-170*scale,340*scale,340*scale);
  ctx.restore();
  for(let k=0;k<12;k++){
   const theta=k/12*Math.PI*2+rot+Math.PI/2;
   const cx=atX(wc)+rad*Math.cos(theta), y=cy+rad*Math.sin(theta);
   asset(k%2?'ferris_gold':'ferris_coral',cx-19*scale,y-11*scale,38*scale,29*scale);
  }
 }
 pixelSign(1750,140,'WORLD 1-2','観覧車');
 worldSprite('crate',1570,74,75,74);
}
function brickProps(){
 worldSprite('brick',2920,345,760,330);
 const open=smooth(clamp((current-3050)/360));
 const dx=atX(3336),dy=ground-137*scale;
 rect(dx-5*scale,dy,124*scale,137*scale,'#49252c');
 if(vis(I.door)){
  ctx.save();ctx.translate(dx,dy);ctx.transform(1,-.05*open,0,1,0,0);
  asset('door',0,0,120*scale*(1-open*.83),137*scale);ctx.restore();
 }
 worldSprite('crate',3520,70,72,70);
 worldSprite('crate',3592,141,72,70);
 pixelSign(2750,175,'WORLD 1-3','赤レンガ');
 // A directional sign replaces the unrelated long WANTED detour.
 pixelSign(3650,173,'NEXT AREA','中華街 →','#f8d590');
}
function chinatownProps(){
 for(let i=0;i<7;i++){
  const x=3900+i*190, swing=Math.sin(current*.006+i)*.09;
  const px=atX(x),py=ground-(275-(i%2)*18)*scale;
  ctx.save();ctx.translate(px+18*scale,py);ctx.rotate(swing);
  asset('lantern',-18*scale,0,36*scale,62*scale);ctx.restore();
 }
 worldSprite('china_gate',4025,338,395,335);
 worldSprite('stall',4440,192,235,180);
 worldSprite('stall',4720,192,235,180,true);
 worldSprite('tram',5050,175,310,170);
 worldSprite('crate',3900,68,69,68);
 pixelSign(3800,170,'WORLD 1-4','中華街');
 pixelSign(5170,250,'NEXT WORLD','TOKYO →');
}
function obstacles(){waterfrontDetails();chinaStreet();portObstacles();ferrisProps();brickProps();chinatownProps()}
function hamPath(s){
 // Cinematic ride section: gondola is at ground level at entry and exit.
 const rideStart=1800,rideEnd=2560;
 if(s>=rideStart&&s<=rideEnd){
  const t=clamp((s-rideStart)/(rideEnd-rideStart));
  const theta=Math.PI/2+smooth(t)*Math.PI*2;
  const rad=165;
  return {wx:2090+rad*Math.cos(theta),lift:230-rad*Math.sin(theta)+11,mode:'ride',p:t};
 }
 if(s>rideEnd)return {wx:2090+(s-rideEnd)*1.38,lift:0,mode:'walk'};
 return {wx:92+s*1.11,lift:0,mode:'walk'};
}
const boxes=[{x:365,h:70},{x:580,h:84},{x:780,h:70},{x:950,h:77},
 {x:1310,h:70},{x:1570,h:74},{x:3520,h:70},{x:3592,h:140},{x:3900,h:68}];
function jumpHeight(wx){
 let best=0;
 for(const b of boxes){
   const start=b.x-150,end=b.x+115;
   if(wx<=start||wx>=end)continue;
   const p=(wx-start)/(end-start);
   // Lift begins before obstacle, peaks above it, lands beyond its far edge.
   const yy=(b.h+44)*Math.sin(Math.PI*p);
   best=Math.max(best,yy);
 }
 return best;
}
function hamster(){
 const path=hamPath(current),sx=atX(path.wx);
 const riding=path.mode==='ride';
 const jump=riding?0:jumpHeight(path.wx);
 const cy=ground-(riding?path.lift:jump)*scale;
 const moving=Math.abs(raw-current)>1 || (current>0&&current<TOTAL-20);
 let pose='ham_idle',ww=86,hh=100,flip=false;
 if(riding){pose='ham_notice';ww=62;hh=91;}
 else if(jump>29){pose='ham_jump';ww=113;hh=78;flip=true;}
 else if(current>4150&&current<4570){pose='ham_eat';ww=87;hh=100;}
 else if(moving){
   const step=Math.floor(current/53)%3;
   pose=step===0?'ham_walk':step===1?'ham_run':'ham_walk';
   ww=step===1?109:112; hh=step===1?82:80;
 }
 const w=ww*scale,h=hh*scale;
 ctx.save();ctx.globalAlpha=.25;ctx.fillStyle='#1c463b';
 ctx.beginPath();ctx.ellipse(sx,ground+5*scale,52*scale*(1-jump/220),9*scale,0,0,Math.PI*2);ctx.fill();ctx.restore();
 if(riding){
   // Put the hamster inside the gondola rather than rotating a single photograph.
   asset(pose,sx-w/2,cy-88*scale,w,h,false);
   asset('ferris_coral',sx-24*scale,cy-28*scale,48*scale,37*scale);
 }else asset(pose,sx-w/2,cy-h,w,h,flip);
 // At specific events a tiny exclamation appears, no pop-up interruption.
 if(current>3890&&current<4070){
   ctx.font=`900 ${Math.round(26*scale)}px sans-serif`;
   ctx.fillStyle='#fff';ctx.fillText('!',sx+32*scale,cy-h-13*scale);
 }
}
function sceneInfo(){
 const wx=hamPath(current).wx;
 const index=wx<1480?0:wx<2680?1:wx<3850?2:3;
 if(index!==lastStage){
  lastStage=index;
  sceneLabel.textContent=STAGES[index].label;
  for(const p of document.querySelectorAll('[data-stage-dot]'))p.classList.toggle('active',Number(p.dataset.stageDot)===index);
 }
 progressFill.style.width=(clamp(current/TOTAL)*100).toFixed(1)+'%';
 if(Math.max(current,raw)>TOTAL-90){status.textContent='YOKOHAMA CLEAR · 東京ワールドへ';next.textContent='東京へ ›'}
 else if(current>1800&&current<2560){status.textContent='観覧車に乗って空へ';next.textContent='次へ ›'}
 else {status.textContent=mobile?'上にスワイプして進む':'スクロールして進む';next.textContent=lastStage===3?'終点へ ›':'次へ ›'}
}
function render(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;
 sky();ctx.save();ctx.translate(0,-cameraY*scale);
 backgrounds();sea();groundLayer();obstacles();hamster();
 ctx.restore();sceneInfo();
 if(loadCount===Object.keys(assets).length&&!ready){ready=true;document.body.classList.add('loaded')}
}
function frame(ts){requested=false;
 if(!lastDraw)lastDraw=ts;
 const dt=Math.min(50,ts-lastDraw);lastDraw=ts;elapsed+=dt;
 raw=clamp(window.scrollY/maxScroll)*TOTAL;
 const diff=raw-current;current+=diff*(Math.abs(diff)>1?.28:.5);
 if(Math.abs(raw-current)<.08)current=raw;
 const wx=hamPath(current).wx;
 const center=worldToCamera(wx);
 camera+= (center-camera)*.22;
 const ride=hamPath(current);
 const newCameraY=ride.mode==='ride'?smooth(clamp((ride.lift-70)/230))*68:0;
 cameraY+=(newCameraY-cameraY)*.2;
 render();
 if(Math.abs(current-raw)>.1||Math.abs(camera-center)>.1||Math.abs(cameraY-newCameraY)>.1){requestFrame();return}
}
function worldToCamera(wx){return clamp(wx-view*(mobile?.30:.32),0,Math.max(0,5500-view))}
function onScroll(){requestFrame()}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',resize,{passive:true});
window.addEventListener('pageshow',()=>{raw=clamp(window.scrollY/maxScroll)*TOTAL;current=raw;requestFrame()});
next.addEventListener('click',()=>{
 const position=clamp(window.scrollY/maxScroll)*TOTAL;
 if(position>=TOTAL-80){window.location.href='hamcello-tokyo-map-design.html?from=yokohama';return}
 // Short, reliable stage checkpoints; the final tap goes directly to TOKYO.
 const stops=[1500,3170,4070,TOTAL];
 const target=stops.find(v=>v>position+55)??TOTAL;
 window.scrollTo({top:(target/TOTAL)*maxScroll,behavior:reduce?'auto':'smooth'});
});
reset.addEventListener('click',()=>window.scrollTo({top:0,behavior:reduce?'instant':'smooth'}));
resize();requestFrame();
if(new URLSearchParams(location.search).get('qa')==='1'){
 window.__hamcelloQA=()=>({progress:current,total:TOTAL,stage:sceneLabel.textContent,
  worldX:hamPath(current).wx,camera,loaded:loadCount,assets:Object.keys(assets).length});
}
if(new URLSearchParams(location.search).get('stage')==='end'){
 const restore=()=>{window.scrollTo({top:maxScroll,behavior:'auto'});requestFrame()};
 requestAnimationFrame(()=>requestAnimationFrame(restore));
 window.addEventListener('pageshow',()=>requestAnimationFrame(restore),{once:true});
}
})();
</script>
