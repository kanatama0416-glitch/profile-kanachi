function createYEngine(images,ctx){
 const I=images; const TOTAL=5000; let W=0,H=0,scale=1,ground=0,view=0,camera=0,cameraY=0,current=0,raw=0,elapsed=0,mobile=false;
 let lastProgress=0,lastMoveDistance=0;
 const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
 const smooth=t=>{t=clamp(t);return t*t*(3-2*t)};
 const mix=(a,b,t)=>a+(b-a)*t;
 const vis=im=>im&&im.complete&&im.naturalWidth>0;
function asset(key,x,y,w,h,flip=false){
 const im=I[key];if(!vis(im))return;
 ctx.save();ctx.imageSmoothingEnabled=false;
 if(flip){ctx.translate(x+w,y);ctx.scale(-1,1);ctx.drawImage(im,0,0,w,h)}
 else ctx.drawImage(im,x,y,w,h);
 ctx.restore();
}
function atX(wx){return (wx-camera)*scale}
function rect(x,y,w,h,clr){ctx.fillStyle=clr;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function pix(x,y,w,h,c){rect(atX(x),ground-y*scale,w*scale,h*scale,c)}
function text(s,x,y,size,color='#fff9dc',align='left'){
 ctx.save();ctx.font=`900 ${Math.round(size*scale)}px sans-serif`;ctx.textAlign=align;ctx.fillStyle=color;ctx.shadowColor='#153b4a';ctx.shadowBlur=0;ctx.shadowOffsetX=2*scale;ctx.shadowOffsetY=3*scale;
 ctx.fillText(s,atX(x),ground-y*scale);ctx.restore();
}
function worldSprite(key,x,fromGround,width,height,flip=false){
 const px=atX(x),py=ground-fromGround*scale;
 const w=width*scale,h=height*scale;
 if(px+w<-120||px>W+120)return;
 asset(key,px,py,w,h,flip);
}
function sky(){
 rect(0,0,W,H,'#01bafe');
 // The reference artwork has a generous cyan sky and square, white clouds.
 // The sky is one continuous color through all four scenes.
 const off=camera*.22;
 for(let j=-1;j<11;j++){
   const cx=(j*510+190-off)*scale;
   if(cx<-180||cx>W+180)continue;
   const cy=H*(.12+(j%3)*.075);
   rect(cx,cy,52*scale,13*scale,'#f9ffff');
   rect(cx+10*scale,cy-13*scale,31*scale,13*scale,'#f9ffff');
   rect(cx+19*scale,cy-21*scale,15*scale,9*scale,'#f9ffff');
 }
}
function sea(){
 const y=ground-63*scale;rect(0,y,W,55*scale,'#027bd0');
 for(let x=Math.floor(camera/110)*110;x<camera+view+140;x+=110){
  const xx=atX(x); rect(xx,y+23*scale,26*scale,5*scale,'#f7fcff');

// Scroll positions are integer CSS pixels; snap subpixel rounding at each stop.
